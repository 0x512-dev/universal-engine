plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.oxdev.universalengine'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.oxdev.universalengine'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DSDL2_SOURCE_PATH=${rootDir}/SDL2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
