name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fetch SDL2 sources and Java glue
        run: |
          curl -fL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          mkdir -p android/SDL2
          tar -xzf sdl2.tar.gz -C android/SDL2 --strip-components=1
          mkdir -p android/app/src/main/java/org/libsdl
          cp -r android/SDL2/android-project/app/src/main/java/org/libsdl/app android/app/src/main/java/org/libsdl/

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: universal-engine-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
